<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrition Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Nutrition Finder</h1>
    <p>Search a food and see its calories, protein, fat and carbs (per 100 g).</p>
  </header>

  <main>
    <form id="search-form">
      <label for="search-input" class="sr-only">Food name</label>
      <input type="text" id="search-input" placeholder="Try: banana, beans, rice" maxlength="60" required>
      <button type="submit" id="search-btn">Search</button>
    </form>

    <div id="controls" class="hidden">
      <label>Filter by category
        <select id="category-filter">
          <option value="all">All categories</option>
        </select>
      </label>

      <label>Sort by
        <select id="sort-select">
          <option value="name">Name (A to Z)</option>
          <option value="protein-desc">Protein (high to low)</option>
          <option value="calories-asc">Calories (low to high)</option>
          <option value="calories-desc">Calories (high to low)</option>
        </select>
      </label>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <div id="results"></div>
  </main>

  <footer>
    <p>Data: USDA FoodData Central. <span id="server-info"></span></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
